<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FBZone - Secure Login</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#0f0f0f;color:white;min-height:100vh}
.top{padding:12px;text-align:center;background:#000;border-bottom:3px solid #ffcc00}
.top h1{color:#ffcc00;letter-spacing:3px;font-size:30px}
.card{max-width:500px;margin:16px auto;background:#1a1a1a;border-radius:14px;padding:18px;border:1px solid #333}
input,select{width:100%;padding:13px;margin:7px 0;background:#222;border:1px solid #333;border-radius:10px;color:white;font-size:16px}
button{width:100%;padding:14px;background:#ffcc00;color:black;border:none;border-radius:10px;font-weight:bold;font-size:16px;cursor:pointer;margin-top:8px}
button:disabled{opacity:0.6}
.post{background:#222;padding:12px;border-radius:12px;margin:12px 0;border:1px solid #333}
.post img{width:100%;border-radius:10px;margin-top:8px}
.meta{font-size:11px;color:#888;margin-top:6px}
.fire{background:#333;color:#ffcc00;padding:6px 12px;border-radius:20px;border:none;cursor:pointer;font-size:12px}
#status{text-align:center;padding:8px;font-size:12px;color:#0f0}
.row{display:flex;gap:8px}.row *{flex:1}
.small{font-size:12px;color:#888;text-align:center;margin-top:8px}
.green{color:#22c55e;font-size:13px;text-align:center}
</style>
</head>
<body>
<div class="top"><h1>FBZONE</h1></div>

<div class="card" id="authCard">
  <h2 style="text-align:center;margin-bottom:12px">Create / Login Account</h2>
  
  <div id="step1">
    <input id="email" type="email" placeholder="Enter your Gmail (e.g. name@gmail.com)">
    <input id="name" type="text" placeholder="Your Full Name (for new account)">
    <button id="sendBtn" onclick="sendCode()">SEND VERIFICATION CODE</button>
    <div class="small">Code valid for 10 minutes. Check your email inbox and spam folder.</div>
  </div>

  <div id="step2" style="display:none">
    <p class="green" id="sentMsg">Code sent!</p>
    <input id="code" type="text" placeholder="Enter 6-digit code from email" maxlength="6">
    <button id="verifyBtn" onclick="verifyCode()">VERIFY & LOGIN</button>
    <div class="small">Didn't get code? Wait 1 min and resend.</div>
    <button onclick="backToStep1()" style="background:#333;color:white;margin-top:8px">Back</button>
  </div>

  <div id="status"></div>
</div>

<div class="card" id="feedCard" style="display:none">
  <h3>Welcome to FBZone! 🔥</h3>
  <div id="posts"></div>
</div>

<script>
const API = "https://bm2-app-.onrender.com"; // <-- YOUR BACKEND URL KEEP AS IT WAS

let currentEmail = "";

async function sendCode(){
  const email = document.getElementById('email').value.trim();
  const name = document.getElementById('name').value.trim();
  if(!email){ alert('Enter email'); return; }
  currentEmail = email;
  document.getElementById('status').innerText = "Sending code...";
  document.getElementById('sendBtn').disabled = true;
  try{
    const res = await fetch(`${API}/api/auth/send-code`, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({email, name})
    });
    const data = await res.json();
    if(res.ok){
      document.getElementById('step1').style.display='none';
      document.getElementById('step2').style.display='block';
      document.getElementById('sentMsg').innerText = `Code sent to ${email} - Check inbox & spam`;
      document.getElementById('status').innerText = "";
    } else {
      document.getElementById('status').innerText = data.message || "Failed to send";
    }
  }catch(e){
    document.getElementById('status').innerText = "Network error, try again";
  }
  document.getElementById('sendBtn').disabled = false;
}

async function verifyCode(){
  const code = document.getElementById('code').value.trim();
  if(!code){ alert('Enter code'); return; }
  document.getElementById('status').innerText = "Verifying...";
  try{
    const res = await fetch(`${API}/api/auth/verify-code`, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({email: currentEmail, code})
    });
    const data = await res.json();
    if(res.ok){
      localStorage.setItem('fbzone_user', JSON.stringify(data.user));
      localStorage.setItem('fbzone_token', data.token);
      document.getElementById('authCard').style.display='none';
      document.getElementById('feedCard').style.display='block';
      document.getElementById('status').innerText = "";
    } else {
      document.getElementById('status').innerText = data.message || "Wrong code";
    }
  }catch(e){
    document.getElementById('status').innerText = "Network error";
  }
}

function backToStep1(){
  document.getElementById('step2').style.display='none';
  document.getElementById('step1').style.display='block';
}

// Auto login if already logged
const saved = localStorage.getItem('fbzone_user');
if(saved){
  document.getElementById('authCard').style.display='none';
  document.getElementById('feedCard').style.display='block';
}
</script>
</body>
</html>
